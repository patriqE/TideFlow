services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    command: >
      sh -c "python manage.py migrate && uvicorn tideflow_backend.asgi:application --host 0.0.0.0 --port 8000 --reload"
